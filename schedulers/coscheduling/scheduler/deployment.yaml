apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    component: scheduler
  name: scheduler-plugins-scheduler
  namespace: coscheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      component: scheduler
  template:
    metadata:
      labels:
        component: scheduler
    spec:
      containers:
      - args:
        - --config=/etc/kubernetes/scheduler-config.yaml
        - --kube-api-qps=1000 # <--QPS
        - --kube-api-burst=1000 # <--QPS
        image: kind-registry:5000/scheduler-plugins/kube-scheduler:v20250319-v0.30.6-2-g54fea8a5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
          initialDelaySeconds: 15
        name: scheduler-plugins-scheduler
        readinessProbe:
          httpGet:
            path: /healthz
            port: 10259
            scheme: HTTPS
        securityContext:
          privileged: false
        volumeMounts:
        - mountPath: /etc/kubernetes
          name: scheduler-config
          readOnly: true
      hostNetwork: false
      hostPID: false
      serviceAccountName: scheduler-plugins-scheduler
      volumes:
      - configMap:
          name: scheduler-config
        name: scheduler-config
