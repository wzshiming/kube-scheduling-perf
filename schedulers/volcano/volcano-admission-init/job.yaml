
apiVersion: batch/v1
kind: Job
metadata:
  name: volcano-admission-init
  namespace: volcano-system
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "5" # set a higher weight to reserve buffers.
  labels:
    app: volcano-admission-init
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: volcano-admission-init
      priorityClassName: system-cluster-critical
      restartPolicy: Never
      containers:
      - name: main
        image: kind-registry:5000/docker.io/volcanosh/vc-webhook-manager:v1.12.0-alpha.0
        imagePullPolicy: IfNotPresent
        command: ["./gen-admission-secret.sh", "--service", "volcano-admission-service", "--namespace", "volcano-system", "--secret", "volcano-admission-secret"]
  ttlSecondsAfterFinished: 1
