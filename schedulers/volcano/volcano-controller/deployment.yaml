
kind: Deployment
apiVersion: apps/v1
metadata:
  name: volcano-controllers
  namespace: volcano-system
  labels:
    app: volcano-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volcano-controller
  template:
    metadata:
      labels:
        app: volcano-controller
    spec:
      serviceAccount: volcano-controllers
      priorityClassName: system-cluster-critical
      containers:
      - name: volcano-controllers
        image: kind-registry:5000/docker.io/volcanosh/vc-controller-manager:v1.12.0-alpha.0
        args:
        - --logtostderr
        - --enable-healthz=true
        - --enable-metrics=true
        - --leader-elect=false
        - --kube-api-qps=1000
        - --kube-api-burst=1000
        - --worker-threads=100
        - --worker-threads-for-gc=100
        - --worker-threads-for-podgroup=100
        - -v=4
        - 2>&1
        imagePullPolicy: IfNotPresent
      terminationGracePeriodSeconds: 1
